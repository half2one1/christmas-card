<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Christmas Card for You ✉</title>
<meta name="description" content="Snow, twinkling lights and a little music box — open with the sound on.">
<meta property="og:title" content="A Christmas card for you ✉">
<meta property="og:description" content="Snow, twinkling lights and a little music box — open with the sound on.">
<meta property="og:image" content="preview.png">
<meta name="theme-color" content="#0b1428">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2a22; --gold:#f3cf86; --cream:#fbf4e4; --red:#a8232f; --glass:rgba(12,20,40,.62);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1428;color:#fff;
  font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 120% 100% at 50% 45%,transparent 55%,rgba(3,6,16,.55) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}
.hidden{display:none!important}

/* ---------------- Envelope ---------------- */
#envelope-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:34px;padding:20px;
  background:radial-gradient(ellipse at center,rgba(10,18,38,.25),rgba(4,8,18,.82));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  transition:opacity 1s ease,transform 1.1s cubic-bezier(.5,0,.2,1)}
#envelope-screen.leaving{opacity:0;transform:scale(1.25);pointer-events:none}
.env-caption{font-style:italic;font-size:clamp(19px,2.4vw,25px);color:#efe2c8;letter-spacing:.05em;
  text-shadow:0 2px 14px #000c;animation:breathe 2.8s ease-in-out infinite;text-align:center}
.env-caption small{display:block;font-size:.7em;opacity:.7;margin-top:6px;letter-spacing:.12em}
.envelope{position:relative;width:min(80vw,410px);aspect-ratio:3/2;cursor:pointer;perspective:1400px;
  animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 28px 36px rgba(0,0,0,.55))}
.envelope:focus-visible{outline:2px dashed var(--gold);outline-offset:12px}
.env-back{position:absolute;inset:0;border-radius:7px;background:linear-gradient(160deg,#cdb68e,#b89c6f)}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;border-radius:4px;
  background:repeating-linear-gradient(transparent 0 17px,rgba(120,90,60,.13) 17px 18px),var(--cream);
  display:flex;align-items:flex-start;justify-content:center;padding-top:9%;
  font-family:'Great Vibes',cursive;color:var(--red);font-size:clamp(26px,5vw,38px);
  transition:transform 1s cubic-bezier(.2,.8,.2,1) .55s;box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.env-front{position:absolute;inset:0;z-index:3;border-radius:7px;pointer-events:none;
  background:linear-gradient(180deg,#f1e2c4,#e2cca3);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top right,transparent 49.6%,rgba(120,90,50,.18) 50%,transparent 50.6%),
             linear-gradient(to top left,transparent 49.6%,rgba(120,90,50,.18) 50%,transparent 50.6%)}
.env-to{position:absolute;z-index:4;left:0;right:0;bottom:12%;text-align:center;pointer-events:none;
  font-family:'Caveat','Nanum Pen Script',cursive;color:#6b4a35;font-size:clamp(18px,3.2vw,24px)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:5;transform-origin:50% 0;
  transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1) .2s,z-index 0s .6s}
.env-flap::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#e7d3ad,#d3b98c);clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.seal{position:absolute;left:50%;top:60%;width:21%;aspect-ratio:1;z-index:6;transform:translate(-50%,-50%);
  border-radius:47% 53% 50% 50%/52% 48% 52% 48%;
  background:radial-gradient(circle at 34% 30%,#e0535d,#a01d2a 55%,#6e0f19 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.3),inset 0 3px 5px rgba(255,180,180,.35);
  display:grid;place-items:center;transition:transform .5s cubic-bezier(.5,-.6,.6,1),opacity .4s}
.seal svg{width:58%;height:58%;opacity:.85}
.envelope.open{animation:none}
.envelope.open .seal{transform:translate(-50%,-90%) scale(1.5) rotate(40deg);opacity:0}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.envelope.open .env-letter{transform:translateY(-58%)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------------- Card ---------------- */
#card{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  padding:clamp(22px,6.5vh,76px) 14px 96px;pointer-events:none}
#title{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(38px,10.5vw,118px);line-height:1.05;
  color:var(--gold);white-space:nowrap;text-align:center;user-select:none}
#title .ch{display:inline-block;opacity:0;
  text-shadow:0 0 18px rgba(255,200,120,.55),0 3px 6px rgba(0,0,0,.45);
  animation:drop 1.1s cubic-bezier(.2,.9,.3,1.25) forwards,glint 5s ease-in-out infinite;
  animation-delay:calc(var(--i)*80ms),calc(1.8s + var(--i)*110ms)}
#title .sp{width:.28em}
#card.instant #title .ch{opacity:1;animation:glint 5s ease-in-out infinite;animation-delay:calc(var(--i)*110ms)}
@keyframes drop{
  0%{opacity:0;transform:translateY(-70px) rotate(-18deg) scale(.5);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:none;filter:none}}
@keyframes glint{0%,78%,100%{color:var(--gold)}
  86%{color:#fffaf0;text-shadow:0 0 30px #ffe9b8,0 0 8px #fff,0 3px 6px rgba(0,0,0,.45)}}
#subtitle{font-style:italic;font-size:clamp(17px,2.2vw,24px);color:#e9dcc6;letter-spacing:.08em;
  text-shadow:0 2px 10px #000b;opacity:0;transform:translateY(8px);transition:opacity 1.2s,transform 1.2s;margin-top:2px}
#subtitle.show{opacity:1;transform:none}

.paper-wrap{position:relative;margin-top:clamp(14px,3vh,30px);width:min(92vw,540px);
  opacity:0;transform:rotate(-1.4deg) translateY(40px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.paper-wrap.show{opacity:1;transform:rotate(-1.4deg)}
.paper-wrap::before{content:"";position:absolute;z-index:2;top:-13px;left:50%;width:120px;height:30px;
  transform:translateX(-50%) rotate(2.5deg);
  background:repeating-linear-gradient(45deg,rgba(190,50,55,.75) 0 8px,rgba(240,225,200,.75) 8px 16px);
  box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:.9}
.holly{position:absolute;z-index:2;right:-14px;top:-18px;width:74px;height:74px;transform:rotate(12deg);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.paper{pointer-events:auto;max-height:min(40vh,430px);overflow:auto;padding:34px 38px 30px 46px;border-radius:5px;
  background:
    linear-gradient(90deg,transparent 30px,rgba(200,80,80,.22) 30px 31px,transparent 31px),
    repeating-linear-gradient(transparent 0 33px,rgba(110,85,60,.14) 33px 34px),
    radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.7),transparent 60%),
    var(--cream);
  background-attachment:local;
  box-shadow:0 22px 55px rgba(0,0,0,.5),inset 0 0 70px rgba(170,130,80,.2);
  scrollbar-width:thin;scrollbar-color:rgba(120,90,60,.4) transparent}
#message{font-family:'Caveat','Nanum Pen Script',cursive;font-weight:500;font-size:clamp(22px,2.7vw,27px);
  line-height:34px;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;min-height:34px}
#message .c{opacity:0;color:#c08a3a;transition:opacity .35s ease,color 1.6s ease}
#message .c.on{opacity:1;color:var(--ink)}
/* fold the letter away to see the scene */
.fold-btn{position:absolute;z-index:3;right:-8px;bottom:-16px;pointer-events:auto;cursor:pointer;
  display:flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.25);background:var(--glass);color:#f6ead2;font-family:inherit;font-size:15px;font-weight:600;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(0,0,0,.35);transform:rotate(1.4deg);transition:transform .2s}
.fold-btn:hover{transform:rotate(1.4deg) translateY(-2px)}
.fold-btn svg{width:16px;height:16px}
.crease{position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:5px;opacity:0;
  background:linear-gradient(transparent 32.6%,rgba(90,60,40,.32) 33.2%,rgba(255,255,255,.55) 33.7%,transparent 34.6%,
    transparent 65.6%,rgba(90,60,40,.32) 66.2%,rgba(255,255,255,.55) 66.7%,transparent 67.6%)}
.paper-wrap.folded{animation:letterFold .9s cubic-bezier(.5,0,.35,1) forwards}
.paper-wrap.unfolding{animation:letterUnfold .9s cubic-bezier(.5,0,.35,1) forwards}
.paper-wrap.folded .crease{animation:crease .9s forwards}
.paper-wrap.unfolding .crease{animation:crease .9s reverse forwards}
.paper-wrap.folded .paper,.paper-wrap.folded .fold-btn,.paper-wrap.unfolding .fold-btn{pointer-events:none}
@keyframes letterFold{
  0%{transform:rotate(-1.4deg);opacity:1}
  40%{transform:rotate(-1.4deg) scaleY(.34);opacity:1}
  55%{transform:rotate(-1deg) scale(.82,.3);opacity:1}
  100%{transform:translate(var(--fx,0),var(--fy,0)) rotate(9deg) scale(.13,.06);opacity:0}}
@keyframes letterUnfold{
  0%{transform:translate(var(--fx,0),var(--fy,0)) rotate(9deg) scale(.13,.06);opacity:0}
  45%{transform:rotate(-1deg) scale(.82,.3);opacity:1}
  60%{transform:rotate(-1.4deg) scaleY(.34);opacity:1}
  100%{transform:rotate(-1.4deg);opacity:1}}
@keyframes crease{0%{opacity:0}30%,100%{opacity:1}}
#letter-note{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:4px;
  font-family:'Caveat','Nanum Pen Script',cursive;font-size:19px;color:#f6ead2;text-shadow:0 1px 6px #000;
  opacity:0;visibility:hidden;transform:scale(.5) rotate(-8deg);transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1),visibility 0s .5s}
#letter-note.show{opacity:1;visibility:visible;transform:none;transition:opacity .4s .55s,transform .6s cubic-bezier(.3,1.6,.5,1) .55s,visibility 0s .55s}
#letter-note.show .ln-paper{animation:float 4s ease-in-out 1.2s infinite}
#letter-note:focus-visible{outline:2px dashed var(--gold);outline-offset:4px;border-radius:8px}
.ln-paper{position:relative;width:70px;height:46px;border-radius:3px;transform:rotate(6deg);
  background:linear-gradient(transparent 32%,rgba(90,60,40,.25) 33%,transparent 35%,transparent 65%,rgba(90,60,40,.25) 66%,transparent 68%),var(--cream);
  box-shadow:0 8px 18px rgba(0,0,0,.5)}
.ln-paper::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#e0535d,#a01d2a 55%,#6e0f19);box-shadow:0 2px 4px rgba(0,0,0,.4)}
@media (max-width:640px){#letter-note{bottom:max(8px,env(safe-area-inset-bottom));font-size:16px;gap:2px}.ln-paper{width:56px;height:38px}}
#message .pen{display:inline-block;width:2px;height:1em;background:#8a5a33;vertical-align:-3px;margin-left:1px;
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------------- UI chrome ---------------- */
#controls{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));
  z-index:30;display:flex;gap:10px}
.btn-round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#f6ead2;cursor:pointer;
  display:grid;place-items:center;transition:transform .2s,background .2s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn-round:hover{transform:translateY(-2px) scale(1.05);background:rgba(30,40,70,.75)}
.btn-round svg{width:22px;height:22px}
.pill{height:48px;padding:0 18px 0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#f6ead2;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;
  display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s;white-space:nowrap}
.pill:hover{transform:translateY(-2px)}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;height:30%;background:var(--gold);border-radius:2px}
.eq.on i{animation:eq .9s ease-in-out infinite}.eq.on i:nth-child(2){animation-delay:.2s}.eq.on i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
#btn-sound.playing{box-shadow:0 0 0 0 rgba(243,207,134,.6),0 6px 18px rgba(0,0,0,.35);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(243,207,134,.5),0 6px 18px rgba(0,0,0,.35)}
  70%{box-shadow:0 0 0 14px rgba(243,207,134,0),0 6px 18px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(243,207,134,0),0 6px 18px rgba(0,0,0,.35)}}
#hint{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;
  pointer-events:none;font-style:italic;font-size:clamp(14px,1.6vw,17px);color:rgba(255,248,235,.82);
  text-shadow:0 1px 6px #000;white-space:nowrap;opacity:0;transition:opacity 1.2s;
  background:rgba(12,20,40,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 16px;border-radius:999px}
#hint.show{opacity:1}
@media (max-width:640px){#hint{bottom:78px;font-size:13px;white-space:normal;width:92vw;text-align:center}}
#toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-20px);z-index:60;opacity:0;pointer-events:none;
  background:rgba(251,244,228,.97);color:var(--ink);padding:11px 20px;border-radius:999px;font-size:17px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .35s,transform .35s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- Composer ---------------- */
#composer{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.composer-card{pointer-events:auto;width:min(94vw,540px);max-height:94vh;overflow:auto;
  background:rgba(12,20,42,.7);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:24px 24px 20px;
  box-shadow:0 30px 70px rgba(0,0,0,.55);animation:rise .9s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.composer-card h2{font-family:'Great Vibes',cursive;font-weight:400;color:var(--gold);font-size:46px;line-height:1;
  text-align:center;text-shadow:0 0 18px rgba(255,200,120,.35)}
.composer-card .lead{text-align:center;color:#d6d9e6;font-size:17px;margin:6px 0 16px;font-style:italic}
#msg-input{width:100%;min-height:220px;resize:vertical;border:none;border-radius:8px;outline:none;
  padding:10px 18px 10px 40px;font-family:'Caveat','Nanum Pen Script',cursive;font-size:25px;line-height:32px;color:var(--ink);
  background:
    linear-gradient(90deg,transparent 26px,rgba(200,80,80,.25) 26px 27px,transparent 27px),
    repeating-linear-gradient(transparent 0 31px,rgba(110,85,60,.16) 31px 32px),var(--cream);
  background-attachment:local;box-shadow:inset 0 0 40px rgba(170,130,80,.2)}
#msg-input:focus{box-shadow:inset 0 0 40px rgba(170,130,80,.2),0 0 0 3px rgba(243,207,134,.55)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#aeb5c9;margin:6px 4px 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:inherit;font-size:17px;font-weight:600;padding:12px 14px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#f6ead2;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.15)}
.btn.primary{grid-column:1/-1;background:linear-gradient(180deg,#c43340,#9a1d29);border-color:#d9545f;font-size:19px;
  box-shadow:0 8px 22px rgba(160,30,40,.45)}
.btn.primary:hover{background:linear-gradient(180deg,#d23d4a,#a8232f)}
.note{font-size:13.5px;color:#9fa8c0;margin-top:14px;line-height:1.45;text-align:center}
.note b{color:#f3cf86;font-weight:600}
@media (prefers-reduced-motion:reduce){.envelope{animation:none}
  .paper-wrap.folded,.paper-wrap.unfolding,.paper-wrap .crease{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A snowy night with a cabin and a Christmas tree"></canvas>
<div id="vignette"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Envelope -->
<div id="envelope-screen" class="hidden">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
    <div class="env-back"></div>
    <div class="env-letter">Merry Christmas</div>
    <div class="env-front"></div>
    <div class="env-to">for you ♡</div>
    <div class="env-flap"></div>
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd9c0" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5M2.8 10.3l3.4.9-.9 3.4M21.2 13.7l-3.4-.9.9-3.4M5.3 9.5l.9 3.4-3.4.9M18.7 14.5l-.9-3.4 3.4-.9"/></svg></div>
  </div>
  <div class="env-caption">tap the seal to open<small>♪ best with sound on</small></div>
</div>

<!-- Card -->
<main id="card" class="hidden">
  <h1 id="title" aria-label="Merry Christmas"></h1>
  <div id="subtitle">&amp; a cozy, happy New Year</div>
  <div class="paper-wrap" id="paper-wrap">
    <svg class="holly" viewBox="0 0 80 80" aria-hidden="true">
      <path d="M40 40 C30 22 14 26 8 18 C14 30 6 36 12 44 C20 40 30 46 40 40Z" fill="#2f7a3e"/>
      <path d="M40 40 C50 20 66 24 72 16 C66 30 74 36 68 44 C60 40 50 48 40 40Z" fill="#256a33"/>
      <path d="M40 40 C24 22 20 26 12 18" stroke="#1b4d25" stroke-width="1.2" fill="none"/>
      <path d="M40 40 C56 22 62 24 70 17" stroke="#1b4d25" stroke-width="1.2" fill="none"/>
      <circle cx="36" cy="44" r="7" fill="#c62a35"/><circle cx="46" cy="46" r="7" fill="#b3202b"/><circle cx="41" cy="36" r="7" fill="#d23440"/>
      <circle cx="34" cy="42" r="2" fill="#fff" opacity=".6"/><circle cx="39" cy="34" r="2" fill="#fff" opacity=".6"/>
    </svg>
    <div class="paper" id="paper"><div id="message" lang="ko"></div></div>
    <div class="crease" aria-hidden="true"></div>
    <button class="fold-btn" id="btn-fold" title="Fold the letter to see the whole scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16"/><path d="m9 19 3 3 3-3M9 5l3-3 3 3"/></svg>fold</button>
  </div>
</main>

<!-- Composer: the one text box -->
<section id="composer" class="hidden">
  <div class="composer-card">
    <h2>Write your card</h2>
    <p class="lead">Your words will appear in handwriting, letter by letter.</p>
    <textarea id="msg-input" maxlength="700" spellcheck="false" aria-label="Your message"></textarea>
    <div class="meta"><span>Korean, English &amp; emoji welcome ✨</span><span id="count">0 / 700</span></div>
    <div class="actions">
      <button class="btn primary" id="btn-preview">✉&nbsp; Preview the card</button>
      <button class="btn" id="btn-link">🔗 Copy link</button>
      <button class="btn" id="btn-email">📋 Copy for email</button>

May your days be merry and bright, your cocoa always warm, and your home full of laughter this Christmas.

Thank you for being part of my year. ✨

Me`;

  for (const b of bytes) bin += String.fromCharCode(b);

/* ======================================================================

const Sound = (() => {
  let ac = null, master, music, sfx, noise, timer = null, playing = false, muted = false;

      mel: 'G4 3,A4 1,G4 2,E4 6,G4 3,A4 1,G4 2,E4 6,D5 4,D5 2,B4 6,C5 4,C5 2,G4 6,' +
           'A4 4,A4 2,C5 3,B4 1,A4 2,G4 3,A4 1,G4 2,E4 6,A4 4,A4 2,C5 3,B4 1,A4 2,G4 3,A4 1,G4 2,E4 6,' +

           'G4 3,F4 1,E4 2,D4 2,C4 2,D4 2,E4 2,C4 2,D4 1,E4 1,F4 1,D4 1,E4 3,D4 1,C4 2,B3 2,C4 4,' +
           'D4 3,E4 1,F4 2,D4 2,E4 3,F4 1,G4 2,D4 2,E4 1,F#4 1,G4 2,A4 1,B4 1,C5 2,B4 2,A4 2,G4 4,' +
           'G4 3,F4 1,E4 2,D4 2,C4 2,D4 2,E4 2,C4 2,A4 1,A4 1,A4 1,A4 1,G4 3,F4 1,E4 2,D4 2,C4 4',
      chords: 'C C G C C C G C G C D G C C F C' },
    wish: { title: 'We Wish You a Merry Christmas', short: 'We Wish You…', E: .2, oct: 12, mv: .19, voice: 'box', bar: 6, start: 2, pat: 'waltz', cv: 'pluck', cvol: [.09, .045],
      mel: 'D4 2,G4 2,G4 1,A4 1,G4 1,F#4 1,E4 2,E4 2,E4 2,A4 2,A4 1,B4 1,A4 1,G4 1,F#4 2,D4 2,D4 2,' +
           'B4 2,B4 1,C5 1,B4 1,A4 1,G4 2,E4 2,D4 1,D4 1,E4 2,A4 2,F#4 2,G4 4',

  const ORDER = ['silent', 'jingle', 'deck', 'wish'];
  Object.values(TRACKS).forEach(sp => {
    const ev = []; let L = 0;

    master.connect(comp); master.connect(verb); verb.connect(wet); wet.connect(comp); comp.connect(ac.destination);

  }

  }

    crunch() { if (!ok()) return; noiseHit(ac.currentTime, .09, .12, 'lowpass', 1300, sfx, .7 + Math.random() * .3); },

})();

      if (Math.max(...paperPile) > 2 && e.clientY > ty - paperPile[j] - 14 && e.clientY < ty + 18) {
        for (let i = 0; i < paperPile.length; i += 3) if (paperPile[i] > 1) {
          const px2 = surf.sl + i * CELL; sparks.push({ x: px2, y: surf.top(px2) - paperPile[i], vx: (Math.random() - .5) * 3 + wind, vy: -1 - Math.random() * 2, life: .9, s: 4 + Math.random() * 5, spr: sprites.flake });
        }
        paperPile.fill(0); Sound.brush();
      }
    }, true);
    addEventListener('deviceorientation', e => {
      if (e.gamma == null) return;
      tpx = clamp(e.gamma / 45, -1, 1) * .5; tpy = clamp((e.beta - 45) / 45, -1, 1) * .3;
    });
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  }

  function start() { build(); bind(); requestAnimationFrame(t => { last = t; draw(t); }); }
  return { start, clearPaper: () => { if (paperPile) paperPile.fill(0); } };
})();

/* ======================================================================
   UI: envelope → card → letters
   ====================================================================== */
let message = DEFAULT_MSG, runToken = 0, opened = false, mode = 'view';
const envScreen = $('#envelope-screen'), envelope = $('#envelope');

function toast(text, ms = 2200) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}

function graphemes(s) {
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)].map(x => x.segment);
  return [...s];
}

/* fold the letter away to reveal (and play with) the whole scene */
const paperWrap = $('#paper-wrap'), letterNote = $('#letter-note');
let folded = false, foldedOnce = false;
function setFolded(on) {
  if (on === folded || !paperWrap.classList.contains('show')) return;
  folded = on;
  const a = paperWrap.getBoundingClientRect(), b = letterNote.getBoundingClientRect();
  if (on) {
    paperWrap.style.setProperty('--fx', (b.left + b.width / 2 - (a.left + a.width / 2)) + 'px');
    paperWrap.style.setProperty('--fy', (b.top + b.height / 2 - (a.top + a.height / 2)) + 'px');
    paperWrap.classList.remove('unfolding'); paperWrap.classList.add('folded');
    letterNote.classList.add('show'); Sound.brush();
    if (hint.i === 0 && $('#hint').classList.contains('show')) hint(1);
    if (!foldedOnce) { foldedOnce = true; setTimeout(() => folded && toast('✨ Tap anything in the scene!', 2600), 900); }
  } else {
    paperWrap.classList.remove('folded'); paperWrap.classList.add('unfolding');
    letterNote.classList.remove('show'); Sound.swish();
  }
}
function resetFold() { folded = false; paperWrap.classList.remove('folded', 'unfolding'); letterNote.classList.remove('show'); }
paperWrap.addEventListener('animationend', e => { if (e.animationName === 'letterUnfold') paperWrap.classList.remove('unfolding'); });
$('#btn-fold').onclick = () => setFolded(true);
letterNote.onclick = () => setFolded(false);
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#card').classList.contains('hidden') && $('#composer').classList.contains('hidden')) setFolded(!folded);
});

function showEnvelope() {
  opened = false; runToken++; resetFold();
  $('#card').classList.add('hidden'); $('#hint').classList.remove('show');
  envelope.classList.remove('open'); envScreen.classList.remove('hidden', 'leaving');
}

function openEnvelope() {
  if (opened) return; opened = true;
  Sound.play(); Sound.whoosh();
  envelope.classList.add('open');
  setTimeout(() => envScreen.classList.add('leaving'), 1650);
  setTimeout(() => showCard(message), 1900);
  setTimeout(() => envScreen.classList.add('hidden'), 2800);
}

function showCard(msg, instant = false) {
  const my = ++runToken;
  const title = $('#title'); title.innerHTML = '';
  [...'Merry Christmas'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = ch === ' ' ? 'ch sp' : 'ch'; s.textContent = ch === ' ' ? ' ' : ch;
    s.style.setProperty('--i', i); title.appendChild(s);
  });
  const sub = $('#subtitle'), pw = $('#paper-wrap'), box = $('#message');
  resetFold(); sub.classList.remove('show'); pw.classList.remove('show'); box.innerHTML = ''; Scene.clearPaper();
  $('#card').classList.remove('hidden');
  $('#btn-replay').classList.remove('hidden');

  const spans = graphemes(msg).map(ch => { const s = document.createElement('span'); s.className = 'c'; s.textContent = ch; box.appendChild(s); return s; });
  const pen = document.createElement('span'); pen.className = 'pen';

  $('#card').classList.toggle('instant', instant);
  if (instant) { sub.classList.add('show'); pw.classList.add('show'); spans.forEach(s => s.classList.add('on')); return; }

  setTimeout(() => my === runToken && sub.classList.add('show'), 1500);
  setTimeout(() => my === runToken && pw.classList.add('show'), 2000);
  setTimeout(() => {
    if (my !== runToken) return;
    const paper = $('#paper'); let i = 0;
    (function step() {
      if (my !== runToken) return;
      if (i >= spans.length) { pen.remove(); hint(); return; }
      const s = spans[i++]; s.classList.add('on'); s.after(pen);
      const bottom = s.offsetTop + 40 - paper.clientHeight;
      if (bottom > paper.scrollTop) paper.scrollTo({ top: bottom, behavior: 'smooth' });
      const ch = s.textContent;
      setTimeout(step, ch === '\n' ? 320 : /[.!?…。]/.test(ch) ? 300 : /[,;:]/.test(ch) ? 160 : 42 + Math.random() * 30);
    })();
  }, 2900);
}

const HINTS = [
  'fold the letter (bottom right of it) to see the whole snowy scene ✉',
  'tap the sledders, the skaters, the snowman or the tree — each one plays a different song 🎵',
  'say hi to Mochi the hamster ♡ — leave footprints in the snow and she’ll follow them',
  'tap the cabin to call someone outside · tap the moon for northern lights 🌌',
  'drag on the snow to leave footprints · press &amp; hold for a snowstorm ❄',
  'snow piles up on the trees, the roof and the snowman — tap them to shake it off ❄',
  'snow settles on your letter too — tap its top edge to brush it off',
  'catch a shooting star 🌠 … Santa might fly by with a present for Mochi'
];
function hint(i = 0) {
  const h = $('#hint'); clearTimeout(hint.t);
  if (i >= HINTS.length) { h.classList.remove('show'); return; }
  hint.i = i; h.innerHTML = HINTS[i]; h.classList.add('show');
  hint.t = setTimeout(() => { h.classList.remove('show'); hint.t = setTimeout(() => hint(i + 1), 1300); }, 6500);
}

/* ======================================================================
   Composer (the one text box)
   ====================================================================== */
function setupComposer() {
  const input = $('#msg-input'), count = $('#count');
  input.value = localStorage.getItem('xmas-card-draft') || '';
  input.placeholder = DEFAULT_MSG;
  const upd = () => { count.textContent = `${input.value.length} / 700`; localStorage.setItem('xmas-card-draft', input.value); };
  input.addEventListener('input', upd); upd();
  const text = () => input.value.trim() || DEFAULT_MSG;
  const isLocal = location.protocol === 'file:';
  if (isLocal) $('#note').innerHTML = 'Previewing from your computer. <b>Host this file first</b> (see README) so the link works for others.<br>Your message lives only inside the link — nothing is uploaded.';

  $('#btn-preview').onclick = () => {
    message = text(); $('#composer').classList.add('hidden'); $('#btn-edit').classList.remove('hidden'); showEnvelope();
  };
  $('#btn-edit').onclick = () => {
    runToken++; resetFold(); $('#card').classList.add('hidden'); envScreen.classList.add('hidden'); $('#hint').classList.remove('show');
    $('#btn-edit').classList.add('hidden'); $('#btn-replay').classList.add('hidden'); $('#composer').classList.remove('hidden');
  };
  $('#btn-link').onclick = async () => {
    const link = cardLink(text());
    try { await navigator.clipboard.writeText(link); toast(isLocal ? '🔗 Copied — but host the file first so it opens for others' : '🔗 Card link copied!', 3200); }
    catch (e) { prompt('Copy this link:', link); }
  };
  $('#btn-email').onclick = async () => {
    const link = cardLink(text());
    let img = '';
    try { const r = await fetch('preview.png', { method: 'HEAD' }); if (r.ok) img = `<a href="${link}"><img src="${new URL('preview.png', baseUrl())}" width="504" alt="A snowy Christmas card" style="display:block;width:100%;max-width:504px;border-radius:12px;margin:0 auto 22px;border:0"></a>`; } catch (e) {}
    const html = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#0f1d36;border-radius:18px;font-family:Georgia,'Times New Roman',serif;color:#f7ecd9"><tr><td style="padding:30px 28px 34px;text-align:center">${img}<div style="font-size:12px;letter-spacing:5px;color:#e9c46a">&#10022; A CHRISTMAS CARD FOR YOU &#10022;</div><div style="font-size:36px;font-style:italic;margin:12px 0 10px;color:#f3cf86">Merry Christmas</div><div style="font-size:16px;line-height:1.6;color:#cfd6e6">I made you a little card with falling snow, twinkling lights and a music box.<br>Open it with the sound on &#128276;</div><a href="${link}" style="display:inline-block;margin-top:24px;padding:14px 34px;background:#b3202b;color:#ffffff;text-decoration:none;border-radius:999px;font-size:17px;font-weight:bold">Open your card &#9993;</a></td></tr></table>`;
    const plain = `Merry Christmas! I made you a little card — open it with the sound on:\n${link}`;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
      toast('📋 Copied! Paste into the body of a new email', 3200);
    } catch (e) {
      try { await navigator.clipboard.writeText(plain); toast('📋 Copied as text (rich copy not supported here)', 3200); } catch (_) { prompt('Copy this:', plain); }
    }
  };
  $('#btn-gmail').onclick = () => {
    const link = cardLink(text());
    const body = `Merry Christmas! 🎄\n\nI made you a little card with falling snow, twinkling lights and a music box.\nOpen it with the sound on:\n\n${link}\n`;
    window.open('https://mail.google.com/mail/?view=cm&fs=1&su=' + encodeURIComponent('A Christmas card for you ✉') + '&body=' + encodeURIComponent(body), '_blank');
  };
}

/* ======================================================================
   Boot
   ====================================================================== */
Sound.ui();
$('#btn-sound').onclick = () => Sound.toggle();
$('#btn-track').onclick = () => toast('🎵 Now playing: ' + Sound.next());
$('#btn-replay').onclick = () => showEnvelope();
envelope.addEventListener('click', openEnvelope);
envelope.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });
window.toast = toast;
Scene.start();

const fromLink = hashMsg();
if (SHOT) {
  $('#controls').classList.add('hidden'); $('#btn-fold').classList.add('hidden');
  if (params.get('shot') === 'card') { showCard(fromLink || DEFAULT_MSG, true); }
  else { showCard('', true); $('#paper-wrap').classList.add('hidden'); }
} else if (fromLink) {
  mode = 'view'; message = fromLink; showEnvelope();
} else {
  mode = 'compose'; $('#composer').classList.remove('hidden'); setupComposer(); setTimeout(() => hint(), 3000);
}
})();
</script>
</body>
